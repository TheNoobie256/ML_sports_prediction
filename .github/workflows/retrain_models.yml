name: Weekly Model Retraining

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  retrain-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.3'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          # Ensure you have a requirements.txt in your root folder!
          pip install -r requirements.txt 

      - name: Retrain Master Soccer Model
        run: python src/train.py

      - name: Retrain NBA Model
        run: python src/train_nba.py

      - name: Commit and Push Updated Models
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Only commit if the .joblib files actually changed
          git add models/*.joblib
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 Auto-retrained XGBoost models with latest weekend data"
          git push